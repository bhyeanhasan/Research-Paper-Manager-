{% load static %}
<style>
    .sidemenu{
    }
</style>
<aside class="sidenav navbar navbar-vertical navbar-expand-xs border-0 border-radius-xl my-3 fixed-start ms-3   bg-gradient-dark"
       id="sidenav-main">

    <div class="sidenav-header">
        <i class="fas fa-times p-3 cursor-pointer text-white opacity-5 position-absolute end-0 top-0 d-none d-xl-none"
           aria-hidden="true" id="iconSidenav"></i>
        <a class="navbar-brand m-0" href="/">
            <img src="{% static 'img/research.png' %}" class="navbar-brand-img h-100" alt="main_logo">
            <span class="ms-1 font-weight-bold text-white">ResearchHub</span>
        </a>
    </div>

    <hr class="horizontal light mt-0 mb-2">

    <div class="collapse navbar-collapse  w-auto " id="sidenav-collapse-main">
        <ul class="navbar-nav">


            <li class="nav-item mt-3">
                <h6 class="ps-4 ms-2 text-uppercase text-xs text-white font-weight-bolder opacity-8">Topics</h6>
            </li>


            <ul class="list-group list-group-flush ps-3 pe-3  text-uppercase text-xs text-white font-weight-bolder rounded-3">
                <li class="sidemenu list-group-item {% if not active_topic %}active{% endif %}">
                    <a class="text-decoration-none {% if not active_topic %}text-white{% endif %}"
                       href="{% url 'community' %}">All</a>
                </li>
                {% for t in topics %}
                    <li class="sidemenu list-group-item {% if active_topic and t == active_topic %}active{% endif %}">
                        <a class="text-decoration-none {% if active_topic and t == active_topic %}text-white{% endif %}"
                           href="{% url 'post_list_by_topic' t.slug %}">{{ t.name }}</a>
                    </li>
                {% endfor %}
            </ul>


            <li class="nav-item mt-3">
                <h6 class="ps-4 ms-2 text-uppercase text-xs text-white font-weight-bolder opacity-8">Tags</h6>
            </li>

            <div class="ps-3 pe-3  text-uppercase text-white font-weight-bolder">
                <div class="card ">
                    <div class="card-body">
                        {% for tg in tags %}
                            <a class="badge text-bg-secondary text-decoration-none"
                               href="{% url 'post_list_by_tag' tg.slug %}">
                                #{{ tg.name }}
                            </a>
                        {% empty %}
                            <span class="text-muted">No tags.</span>
                        {% endfor %}
                    </div>
                </div>

            </div>


        </ul>
    </div>

    <div class="sidenav-footer position-absolute w-100 bottom-0 ">
        <div class="mx-3">
            <a class="btn btn-outline-primary mt-4 w-100"
               href="/admin"
               type="button">Admin</a>

        </div>
    </div>
</aside>
